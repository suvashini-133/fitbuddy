<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBuddy – AI Workout Generator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">
      🏋️ <span>FitBuddy</span> AI
    </a>
    <div class="nav-links">
      <a href="/view-all-users">Admin Dashboard</a>
      <a href="/docs" target="_blank">API Docs</a>
    </div>
  </nav>

  <main class="container">
    <div class="card">
      <h1 class="card-title">⚡ FitBuddy – AI Workout Generator</h1>
      <p class="card-subtitle">Personalized 7-day training routines & nutrition powered by Google Gemini</p>

      <form action="/generate-workout" method="POST">
        <div class="form-group">
          <label for="username">Full Name:</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="e.g. Alex Johnson" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="user_id">User ID:</label>
            <input type="number" id="user_id" name="user_id" class="form-control" placeholder="e.g. 101" required min="1">
          </div>
          <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" class="form-control" placeholder="e.g. 26" required min="12" max="100">
          </div>
        </div>

        <div class="form-group">
          <label for="weight">Weight (kg):</label>
          <input type="number" step="0.1" id="weight" name="weight" class="form-control" placeholder="e.g. 74.5" required min="20" max="300">
        </div>

        <div class="form-group">
          <label for="goal">Fitness Goal:</label>
          <input type="text" id="goal" name="goal" class="form-control" placeholder="e.g. Weight Loss, Muscle Gain, Core Strength" required>
        </div>

        <div class="form-group">
          <label for="intensity">Workout Intensity:</label>
          <select id="intensity" name="intensity" class="form-control" required>
            <option value="Low">Low (Beginner / Light Activity)</option>
            <option value="Medium" selected>Medium (Moderate Intensity)</option>
            <option value="High">High (Challenging / Advanced)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">
          🚀 Generate Plan
        </button>
      </form>
    </div>
  </main>

  <footer>
    FitBuddy AI • Powered by FastAPI, SQLAlchemy & Google Gemini Models
  </footer>
</body>
</html>
